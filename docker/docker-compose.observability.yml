# ─────────────────────────────────────────────────────────────────────────────
# REVOC — opt-in observability stack overlay.
#
#   make up-obs
#     → docker compose -f docker/docker-compose.yml \
#                       -f docker/docker-compose.observability.yml up -d
#
# Adds Jaeger (traces), Prometheus (metrics), Grafana (dashboards), and an
# OTel collector that fans REVOC's OTLP export out to both. Never started by
# `make up` alone — purely additive, and safe to tear down independently:
#
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.observability.yml down
# ─────────────────────────────────────────────────────────────────────────────

name: revoc

services:
  revoc-proxy:
    environment:
      REVOC_TELEMETRY__OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: revoc-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - revoc-net
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: revoc-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
    networks:
      - revoc-net

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: revoc-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - revoc-prometheus-data:/prometheus
    ports:
      - "9091:9090"   # Prometheus UI (9090 is taken by revoc-proxy metrics)
    networks:
      - revoc-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: revoc-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - revoc-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # Grafana UI (3000 is taken by the REVOC dashboard)
    networks:
      - revoc-net
    depends_on:
      - prometheus
      - jaeger

volumes:
  revoc-prometheus-data:
  revoc-grafana-data:
