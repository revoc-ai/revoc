# Prometheus scrape configuration for the REVOC observability overlay.
#
# Scrapes REVOC's native /metrics endpoint directly (port 9090) AND the
# OTel collector's Prometheus exporter (port 8889) so both push- and
# pull-based metrics paths are covered.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: revoc-local

scrape_configs:
  - job_name: revoc-proxy
    static_configs:
      - targets: ["revoc-proxy:9090"]
        labels:
          service: revoc-proxy

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
