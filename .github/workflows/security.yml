name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 06:00 UTC — catches newly disclosed advisories
    # against pinned dependencies even when no code changes.
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  security-events: write   # required for SARIF upload to GitHub Security tab

jobs:
  cargo-deny:
    name: Rust / cargo-deny (licenses, bans, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny --workspace --all-features check

  cargo-audit:
    name: Rust / cargo-audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ubuntu-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  python-audit:
    name: Admin API / pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit — admin-api
        working-directory: admin-api
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e .
          pip-audit --skip-editable --progress-spinner=off
      - name: pip-audit — sdk/python
        working-directory: sdk/python
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --skip-editable --progress-spinner=off

  trivy-fs:
    name: Filesystem / Trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (SARIF output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-results.sarif
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    name: Repo / Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI (MIT) — gitleaks-action requires a paid license on org repos.
      # Intentional fake credentials in tests/docs are allowlisted in .gitleaks.toml.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  opa-policy-check:
    name: Policies / OPA strict check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - run: opa check policies/ --strict
