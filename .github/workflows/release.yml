name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_PROXY: ghcr.io/revoc-ai/revoc

jobs:
  # ── Gate: tests must pass before any publishing step ─────────────────────────
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ubuntu-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: OPA policy tests
        run: opa test policies/ -v --coverage

  # ── Changelog ─────────────────────────────────────────────────────────────────
  changelog:
    name: Generate changelog excerpt
    needs: test
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.git-cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

  # ── Build release binaries ────────────────────────────────────────────────────
  build-binaries:
    name: Build release binary (${{ matrix.target }})
    needs: [test, changelog]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-
      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p revoc-proxy
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/revoc-proxy-${{ matrix.target }}.tar.gz" \
            -C target/${{ matrix.target }}/release revoc-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: revoc-proxy-${{ matrix.target }}
          path: dist/*.tar.gz

  # ── Build and push container images (multi-arch) ─────────────────────────────
  # Each architecture builds on a native runner (no QEMU), pushed by digest;
  # docker-publish then joins the digests into one multi-arch tag per image.
  docker-build:
    name: Build image (${{ matrix.variant }}, ${{ matrix.arch }})
    needs: [test, changelog]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        variant: [proxy, ml]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - variant: proxy
            dockerfile: crates/revoc-proxy/Dockerfile
            ml: "false"
          - variant: ml
            dockerfile: crates/revoc-proxy/Dockerfile.ml
            ml: "true"
    env:
      # No build-record artifacts; the release job does not need them.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            ML_ENABLED=${{ matrix.ml }}
          outputs: type=image,name=${{ env.IMAGE_PROXY }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}
      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publish multi-arch image tags
    needs: [docker-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [proxy, ml]
    steps:
      - name: Compute tags
        id: meta
        run: |
          v="${GITHUB_REF_NAME#v}"
          suffix=""
          [[ "${{ matrix.variant }}" == "ml" ]] && suffix="-ml"
          # Pre-releases (v0.1.0-beta.1) never move the :latest tags.
          if [[ "$v" == *-* ]]; then moving="beta"; else moving="latest"; fi
          echo "tags=-t ${{ env.IMAGE_PROXY }}:${v}${suffix} -t ${{ env.IMAGE_PROXY }}:${moving}${suffix}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create ${{ steps.meta.outputs.tags }} $(printf '${{ env.IMAGE_PROXY }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE_PROXY }}:${GITHUB_REF_NAME#v}$([[ '${{ matrix.variant }}' == ml ]] && echo -ml)"

  # ── Package Helm chart ────────────────────────────────────────────────────────
  helm-package:
    name: Package Helm chart
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Fetch chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build helm/revoc/
      - name: Lint chart
        run: helm lint helm/revoc/
      - name: Package chart
        run: |
          helm package helm/revoc/ \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.meta.outputs.version }}" \
            --destination dist/
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/revoc-*.tgz

  # ── Publish Python SDK to PyPI ───────────────────────────────────────────────
  publish-python-sdk:
    name: Publish Python SDK to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version matches tag
        run: |
          # PEP 440 spelling of the tag: v0.1.0-beta.1 -> 0.1.0b1
          want="$(echo "${GITHUB_REF_NAME#v}" | sed -E 's/-alpha\.?/a/; s/-beta\.?/b/; s/-rc\.?/rc/')"
          have="$(grep -m1 '^version' sdk/python/pyproject.toml | cut -d'"' -f2)"
          if [[ "$have" != "$want" ]]; then
            echo "::error::sdk/python version $have does not match tag ${GITHUB_REF_NAME} (expected $want)"
            exit 1
          fi
      - name: Build
        run: |
          cd sdk/python
          pip install --upgrade hatchling build
          python -m build
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          # Lets a re-run (or a re-pushed tag) finish when this version is
          # already on PyPI instead of failing the whole release.
          skip-existing: true

  # ── Publish Node SDK to npm ───────────────────────────────────────────────────
  publish-node-sdk:
    name: Publish Node SDK to npm
    needs: [test]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install, build, test and publish (with provenance)
        run: |
          cd sdk/node
          pkg="$(node -p "require('./package.json').version")"
          if [[ "v${pkg}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::package.json version ${pkg} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          if npm view "@revoc-io/sdk@${pkg}" version >/dev/null 2>&1; then
            echo "@revoc-io/sdk@${pkg} is already published; skipping"
            exit 0
          fi
          npm ci
          npm run build
          npm test
          # Pre-release versions publish under the "beta" dist-tag, not "latest".
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --access public --provenance --tag beta
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Publish GitHub release ────────────────────────────────────────────────────
  github-release:
    name: Publish GitHub release
    needs: [changelog, build-binaries, docker-publish, helm-package, publish-python-sdk, publish-node-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Download only the release assets: docker/build-push-action also
      # uploads *.dockerbuild build records, which fail to extract here.
      - uses: actions/download-artifact@v4
        with:
          pattern: revoc-proxy-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tgz
          body: ${{ needs.changelog.outputs.notes }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

# Documentation is deployed to revoc.io by .github/workflows/docs.yml
# (GitHub Pages, "GitHub Actions" source) on every push to main.
