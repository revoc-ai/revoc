[package]
name        = "revoc-proxy"
version     = "0.1.0-beta.1"
edition     = "2021"
description = "REVOC proxy binary: LLM + MCP handlers, middleware, streaming, kill-switch, CLI"
license     = "Apache-2.0"
repository  = "https://github.com/revoc-ai/revoc"

[[bin]]
name = "revoc-proxy"
path = "src/main.rs"

[dependencies]
# Internal — all 8 upstream crates
revoc-core      = { path = "../revoc-core" }
revoc-config    = { path = "../revoc-config" }
revoc-telemetry = { path = "../revoc-telemetry" }
revoc-detector  = { path = "../revoc-detector" }
revoc-pipeline  = { path = "../revoc-pipeline" }
revoc-policy    = { path = "../revoc-policy" }
revoc-redaction = { path = "../revoc-redaction" }
revoc-dashboard = { path = "../revoc-dashboard" }

# HTTP framework
axum           = { workspace = true }
axum-extra     = { workspace = true }
tower          = { workspace = true }
tower-http     = { workspace = true }

# Low-level HTTP
hyper          = { workspace = true }
hyper-util     = { workspace = true }

# Upstream HTTP client
reqwest        = { workspace = true }

# Async runtime
tokio          = { workspace = true }
tokio-util     = { workspace = true }
tokio-stream   = { workspace = true }
futures        = { workspace = true }
async-trait    = { workspace = true }

# Serialization
serde          = { workspace = true }
serde_json     = { workspace = true }

# Bytes and HTTP primitives
bytes          = { workspace = true }
http           = { workspace = true }
http-body-util = { workspace = true }

# IDs and timestamps
uuid           = { workspace = true }
chrono         = { workspace = true }

# Tracing
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# Kill-switch + rate limiter
dashmap        = { workspace = true }
arc-swap       = { workspace = true }
redis          = { workspace = true }

# CLI
clap           = { workspace = true }

# Shutdown signal
nix            = { workspace = true }

# Security
url            = { workspace = true }
subtle         = { workspace = true }
zeroize        = { workspace = true }
sha2           = { workspace = true }
hex            = { workspace = true }

# Auth
jsonwebtoken   = { workspace = true }

# Metrics
prometheus     = { workspace = true }

# Storage
sqlx           = { workspace = true }

# Misc
mime           = { workspace = true }
once_cell      = { workspace = true }
rust_decimal   = { workspace = true }
anyhow         = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true }
tokio-test     = { workspace = true }
wiremock       = { workspace = true }
rstest         = { workspace = true }
assert_matches = { workspace = true }
insta          = { workspace = true }
fake           = { workspace = true }
criterion      = { workspace = true }
