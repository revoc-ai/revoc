# git-cliff configuration — https://git-cliff.org/
# Generates CHANGELOG.md from Conventional Commits.
# Run: git cliff --output CHANGELOG.md

[changelog]
# Header placed at the top of every generated changelog
header = """
# Changelog

All notable changes to REVOC are documented in this file.
Format follows [Keep a Changelog](https://keepachangelog.com/en/1.0.0/).
Versioning follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Tera template for each release section
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}\
  {{ commit.message | upper_first }} \
  ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/revoc-ai/revoc/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""

# Footer placed at the end of each release section
footer = ""

# Strip leading and trailing whitespace from the template output
trim = true

# ─────────────────────────────────────────────────────────────────────────────
# Git commit parsing
# ─────────────────────────────────────────────────────────────────────────────
[git]
# Only use Conventional Commits format
conventional_commits    = true
filter_unconventional   = true
split_commits           = false

# Map commit types to changelog section headings
commit_parsers = [
    { message = "^feat",     group = "Features" },
    { message = "^fix",      group = "Bug Fixes" },
    { message = "^perf",     group = "Performance" },
    { message = "^sec",      group = "Security" },
    { message = "^security", group = "Security" },
    { message = "^docs",     group = "Documentation" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style",    skip  = true },
    { message = "^test",     skip  = true },
    { message = "^chore",    skip  = true },
    { message = "^ci",       skip  = true },
    { message = "^build",    skip  = true },
]

# Do not include commits whose messages match these patterns
filter_commits = false

# Use tags matching vX.Y.Z (semantic versions)
tag_pattern = "v[0-9]*"

# Sort commits from newest to oldest within each section
sort_commits = "newest"

# Link commit SHAs and issue numbers
link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/revoc-ai/revoc/issues/$1" },
    { pattern = "RFC-(\\d+)", text = "RFC-$1", href = "https://github.com/revoc-ai/revoc/discussions/$1" },
]
