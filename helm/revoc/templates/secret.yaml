{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "revoc.secretName" . }}
  labels:
    {{- include "revoc.labels" . | nindent 4 }}
type: Opaque
stringData:
  REVOC_AUTH__ADMIN_KEY: {{ .Values.secrets.adminKey | quote }}
  REVOC_API_KEYS: {{ .Values.secrets.apiKeys | quote }}
  {{- if .Values.secrets.jwtSecret }}
  REVOC_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "revoc.postgresqlFullname" . }}:5432/{{ .Values.postgresql.auth.database }}"
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: "redis://{{ include "revoc.redisFullname" . }}:6379"
  {{- end }}
  {{- if or .Values.redis.enabled .Values.postgresql.enabled }}
  {{- /* Kill-switch state is shared through Redis or Postgres and must be
         signed with the same key on every instance. Generated once and kept
         across upgrades when not supplied. */}}
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "revoc.secretName" .)) }}
  {{- $ksKey := .Values.secrets.killSwitchSigningKey }}
  {{- if and (not $ksKey) $existing $existing.data }}
  {{- $ksKey = (index $existing.data "REVOC_KILL_SWITCH_KEY" | default "" | b64dec) }}
  {{- end }}
  REVOC_KILL_SWITCH_KEY: {{ $ksKey | default (randAlphaNum 48) | quote }}
  {{- end }}
{{- end }}
