[workspace]
resolver = "2"
members = [
    "crates/revoc-core",
    "crates/revoc-config",
    "crates/revoc-telemetry",
    "crates/revoc-detector",
    "crates/revoc-pipeline",
    "crates/revoc-policy",
    "crates/revoc-redaction",
    "crates/revoc-dashboard",
    "crates/revoc-proxy",
    "benches",
]
exclude = ["fuzz"]

# ─────────────────────────────────────────────────────────────────────────────
# Shared dependencies — all crates reference these with workspace = true
# to ensure a single resolved version across the entire workspace.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
axum = { version = "0.7", features = ["http2", "macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
reqwest = { version = "0.12", features = [
    "json",
    "stream",
    "rustls-tls",
    "gzip",
], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.27"
opentelemetry = { version = "0.26", features = ["metrics"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic", "metrics"] }
opentelemetry-semantic-conventions = "0.26"
dashmap = "6.1"
arc-swap = "1.7"
smallvec = { version = "1.13", features = ["serde"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
redis = { version = "0.27", features = [
    "tokio-comp",
    "connection-manager",
    "aio",
] }
wasmtime = { version = "49.0.5", default-features = false, features = [
    "runtime",
    "std",
    "cranelift",
    "component-model",
] }
ort = { version = "2.0.0-rc.15", features = [
    "load-dynamic",
], default-features = false }
ndarray = "0.15"
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
zeroize = "1.8"
unicode-normalization = "0.1"
regex = "1.10"
fancy-regex = "0.13"
config = { version = "0.14", features = ["toml", "yaml"] }
jsonwebtoken = "9.3"
prometheus = { version = "0.14", features = ["process"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1.7"
http = "1.1"
http-body-util = "0.1"
once_cell = "1.19"
mime = "0.3"
include_dir = "0.7"
rust_decimal = { version = "1.36", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
nix = { version = "0.29", features = ["signal"] }
base64 = "0.22"
url = "2.5"
assert_matches = "1.5"
tokio-test = "0.4"
wiremock = "0.6"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
rstest = "0.22"
fake = { version = "2.9", features = ["derive"] }
insta = { version = "1.39", features = ["json", "yaml"] }
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }

# ─────────────────────────────────────────────────────────────────────────────
# Build profiles
# ─────────────────────────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true
incremental = true
