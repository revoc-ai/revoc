[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revoc-gateway"
version = "0.1.0b1"
description = "REVOC Admin API — policy management, audit, and emergency controls"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.6.1,<3",
    "pydantic[email]>=2.10.0,<3",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "aiosqlite==0.20.0",
    "asyncpg==0.30.0",
    "redis[hiredis]==5.2.0",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=4.0.1,<4.1.0",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "structlog==24.4.0",
    "pyyaml==6.0.2",
    "jsonschema==4.23.0",
    "python-multipart==0.0.33",
    "weasyprint==70.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-pyyaml==6.0.12.20240917",
    "types-passlib==1.7.7.20240819",
    "locust>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",     # flake8-annotations — mypy covers type checking
    "D",       # pydocstyle — no docstring policy
    "ERA",     # eradicate — allow commented-out code
    "FBT",     # flake8-boolean-trap — too strict for FastAPI Depends
    "EM",      # flake8-errmsg — f-strings in exceptions are fine here
    "TRY003",  # long messages outside exception class
    "S",       # bandit — security audited separately
    "T20",     # print — structlog used instead, but print allowed in scripts
    "COM812",  # trailing-comma-missing — conflicts with ruff formatter
    "ISC001",  # single-line-implicit-string-concatenation — conflicts with formatter
    "RUF012",  # mutable-class-attributes — pydantic BaseModel handles defaults
    "UP007",   # use X | Y for Union — keep Optional for Pydantic compat
    "TCH",     # flake8-type-checking — avoid deferred imports in Pydantic models
    "G004",    # logging-f-string — structlog uses keyword args, but some helpers use f-strings
    "B008",    # do-not-perform-function-call-in-defaults — FastAPI Depends() requires this
    "FAST002", # fastapi-depends-without-annotated — both styles are valid FastAPI
    "PLR0913", # too-many-arguments — router functions legitimately need many params
    "UP035",   # deprecated-import — collections.abc vs typing handled by UP006/UP007
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "PLR2004",
    "SLF001",
    "ARG001",
] # assert, magic values, private access, unused args in tests

# ── Mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
]
